# /etc/collectd.conf - collectd na nBoxie (pakiet collectd-nbox). Wysyla do
# collectd routera jak routery 19.07; RRD powstaja na routerze w
# /tmp/rrd/<Hostname>. Bez rrdtool - na boxie nic nie jest zapisywane.
#
# Do ustawienia na kazdym boxie (wszystkie maja hostname GraterliaOS):
#   Hostname - nazwa katalogu RRD na routerze, np. nBoxSalon;
#              dopoki jest ZMIEN_MNIE, /etc/init.d/collectd nie startuje
#   Server   - adres routera z collectd (tu przyklad 192.168.1.1)
Hostname "ZMIEN_MNIE"
FQDNLookup false
BaseDir "/tmp"
PIDFile "/tmp/collectd.pid"
PluginDir "/usr/lib/collectd"
TypesDB "/usr/share/collectd/types.db"
Interval 30
ReadThreads 1
WriteThreads 1

LoadPlugin syslog
<Plugin syslog>
	LogLevel info
</Plugin>

LoadPlugin cpu
<Plugin cpu>
	ValuesPercentage true
</Plugin>

LoadPlugin memory
<Plugin memory>
	ValuesPercentage true
	ValuesAbsolute true
</Plugin>

LoadPlugin load
LoadPlugin uptime

LoadPlugin interface
<Plugin interface>
	Interface "lo"
	IgnoreSelected true
</Plugin>

LoadPlugin df
<Plugin df>
	MountPoint "/"
	MountPoint "/hdd"
	ValuesPercentage true
</Plugin>

LoadPlugin disk
<Plugin disk>
	Disk "sda"
</Plugin>

# Temperatura dysku z nbox_monitor.sh (COLLECTD_PLIK): linia "sda 45", pusty
# plik = brak wartosci (dysk spi). RRD jak z pluginu hddtemp:
# hddtemp/temperature-sda. Pusty plik zaklada /etc/init.d/collectd - bez
# pliku kazdy odczyt to blad i collectd coraz rzadziej probuje.
LoadPlugin table
<Plugin table>
	<Table "/tmp/collectd_nbox.tab">
		Plugin "hddtemp"
		Instance ""
		Separator " "
		<Result>
			Type temperature
			InstancesFrom 0
			ValuesFrom 1
		</Result>
	</Table>
</Plugin>

LoadPlugin network
<Plugin network>
	Server "192.168.1.1" "25826"
</Plugin>
